<!DOCTYPE html>
{% load i18n %}
{% load static %}

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Hangarin | Confirm sign in</title>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="login-page login-loading">
  <div class="background-wall" aria-hidden="true">
    <div class="vertical vertical-0"><div class="horizontal sports"></div><div class="horizontal nature"></div><div class="horizontal business"></div><div class="horizontal people"></div><div class="horizontal technics"></div><div class="horizontal fashion"></div></div>
    <div class="vertical vertical-1"><div class="horizontal city"></div><div class="horizontal sports"></div><div class="horizontal animals"></div><div class="horizontal nature"></div><div class="horizontal people"></div><div class="horizontal business"></div></div>
    <div class="vertical vertical-2"><div class="horizontal fashion"></div><div class="horizontal animals"></div><div class="horizontal city"></div><div class="horizontal technics"></div><div class="horizontal sports"></div><div class="horizontal nature"></div></div>
    <div class="vertical vertical-3"><div class="horizontal people"></div><div class="horizontal business"></div><div class="horizontal fashion"></div><div class="horizontal city"></div><div class="horizontal animals"></div><div class="horizontal sports"></div></div>
    <div class="vertical vertical-4"><div class="horizontal nature"></div><div class="horizontal technics"></div><div class="horizontal people"></div><div class="horizontal animals"></div><div class="horizontal business"></div><div class="horizontal city"></div></div>
    <div class="vertical vertical-5"><div class="horizontal sports"></div><div class="horizontal fashion"></div><div class="horizontal nature"></div><div class="horizontal technics"></div><div class="horizontal people"></div><div class="horizontal animals"></div></div>
    <div class="vertical vertical-6"><div class="horizontal city"></div><div class="horizontal business"></div><div class="horizontal sports"></div><div class="horizontal people"></div><div class="horizontal fashion"></div><div class="horizontal nature"></div></div>
    <div class="vertical vertical-7"><div class="horizontal technics"></div><div class="horizontal animals"></div><div class="horizontal city"></div><div class="horizontal business"></div><div class="horizontal sports"></div><div class="horizontal people"></div></div>
    <div class="vertical vertical-8"><div class="horizontal fashion"></div><div class="horizontal nature"></div><div class="horizontal animals"></div><div class="horizontal technics"></div><div class="horizontal city"></div><div class="horizontal business"></div></div>
    <div class="vertical vertical-9"><div class="horizontal people"></div><div class="horizontal sports"></div><div class="horizontal fashion"></div><div class="horizontal animals"></div><div class="horizontal nature"></div><div class="horizontal technics"></div></div>
  </div>

  <div class="login-mask"></div>

  <main class="login-shell">
    <section class="login-card" aria-labelledby="confirm-title">
      <div
        class="login-circle"
        style="background-image: url('{% static 'img/background.png' %}');"
        aria-hidden="true"
      ></div>

      <div class="login-content">
        <div class="login-brand"><span class="brand-icon"></span><span>Hangarin</span></div>
        <p class="login-kicker">Personal command center</p>
        <h1 id="confirm-title">Confirm Sign In</h1>
        <p class="login-subtitle">You are about to sign in using your <strong>{{ provider.name }}</strong> account.</p>

        <form method="post" class="login-form">
          {% csrf_token %}
          <button type="submit" class="login-submit">Continue with {{ provider.name }}</button>
        </form>

        <p class="login-footer"><a href="{% url 'account_login' %}">Cancel and return to sign in</a></p>
      </div>
    </section>
  </main>

  <div id="copy">
    <a href="https://twitter.com/igcorreia" target="_blank" rel="noopener noreferrer">Crafted by: <b>@AEDL.ayym</b></a>
  </div>

  <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
